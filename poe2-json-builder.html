<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PoE2 JSON Generator</title>
  <link rel="stylesheet" href="css/common.css">
  <style>
    /* --- 共通化によって、ここにあった大量のCSSは削除されました --- */

    textarea {
      display: block;
      width: 100%;
      height: 200px;
      background-color: var(--black10);
      color: white;
      border: 1px solid var(--border-color);
      border-radius: var(--radius-sm);
      padding: 12px;
      font-family: monospace;
      font-size: 14px;
      resize: vertical;
      transition: all 0.2s;
      white-space: pre;
      overflow-x: auto;
    }

    textarea:focus {
      outline: none;
      border-color: #ffffff;
      box-shadow: 0 0 10px 2px var(--white20);
    }

    textarea::placeholder {
      color: var(--separator-color);
    }

    #errorMessage {
      width: 100%;
      color: #fca5a5;
      font-weight: bold;
      white-space: pre-wrap;
    }

    #errorMessage:empty {
      display: none;
    }

    #outputJsonArea {
      height: 300px;
      background-color: #171514;
    }

    #processBtn.is-success {
      color: #86efac;
    }

    #processBtn.is-error {
      color: #fca5a5;
    }

    /* 視覚的には隠すがスクリーンリーダーには読ませる（テキストエリアのlabel用） */
    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }
  </style>
</head>

<body>
  <div class="page-container">
    <nav class="nav-container">
      <a href="poe2-index.html" class="nav-link">Index</a>
      <a href="poe2-campaign.html" class="nav-link">キャンペーン</a>
      <a href="poe2-endgame-maps.html" class="nav-link">エンドゲームマップ</a>
      <a href="poe2-memo.html" class="nav-link">メモ</a>
      <a href="poe2-json-builder.html" class="nav-link active">JSON Builder</a>
    </nav>
    <header class="page-header">
      <h1>PoE2 JSON Generator</h1>
    </header>
    <main class="main-content">
      <div class="controls-wrapper">
        <label class="sr-only" for="inputArea">スプレッドシートからコピーしたTSVデータ</label>
        <textarea id="inputArea"
          placeholder="スプレッドシートからコピーしたTSVデータをここに貼り付けてください...&#10;※ボスやバフなど、出力したい単一のシートのデータを貼り付けます"></textarea>
        <div id="errorMessage" role="alert" aria-live="assertive"></div>
        <div class="separator-horizontal"></div>

        <div class="control-bar">
          <button id="processBtn" type="button" class="btn-action">📋 変換してコピー</button>
          <button id="resetBtn" type="button" class="btn-danger ml-auto">✖ リセット</button>
        </div>
      </div>
      <div class="controls-wrapper">
        <h3 style="margin-top:0; color:var(--text-muted);">JSON出力コード (プレビュー)</h3>
        <label class="sr-only" for="outputJsonArea">変換後のJSON出力</label>
        <textarea id="outputJsonArea" readonly placeholder="変換されたJSONコードがここに表示されます..."></textarea>
      </div>
    </main>
  </div>
  <script type="module" src="js/poe2-json-builder.js"></script>
</body>

</html>
